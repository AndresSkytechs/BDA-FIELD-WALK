   SKYLIGHT FIELD WALK — APP DE TELÉFONO (sin cuenta de Claude)
   Puente entre la página de Wil y el teléfono.

   La página de Wil se usa TAL CUAL, sin tocar su código. Ella pide sus
   servicios a `window.claude.use(...)`; aquí se los damos nosotros:

     db         → base de datos en el teléfono (IndexedDB), misma API que la
                  de Claude. Fase 2: se sincroniza con el servidor compartido.
     user       → el técnico elige su nombre una vez (lista de Wil, ROSTER).
     downloads  → el PDF se manda por la hoja de compartir (WhatsApp / correo).
     mcp        → Gmail: con PDF → hoja de compartir; sin PDF → app de correo.
                  Drive: todavía no (Fase 2); las fotos se guardan en la app.
     room, assets → no se usan en el teléfono.

   Fase 2 (servidor compartido): si la app tiene SERVER, todo lo que se
   escribe se sube al servidor (Apps Script en el Drive de Skylight) y lo que
   escriben los demás técnicos baja solo. Sin SERVER funciona sola en el
   teléfono, como la Fase 1.

   Andres, 2026-11-18.
   ═══════════════════════════════════════════════════════════════════════ */

<title>Skylight Field Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EFF1F4;--surface:#FFFFFF;--surface-2:#F7F8FA;--surface-3:#EEF1F5;
  --ink:#161A20;--ink-2:#3D4652;--muted:#6B7480;--line:#D8DCE3;--line-strong:#B9C0CA;
  --accent:#4B2A7B;--accent-soft:#EFEAF7;--on-accent:#fff;
  --ok:#186B45;--ok-soft:#E2F0E8;--warn:#8A5A00;--warn-soft:#FBEFD5;--bad:#A32020;--bad-soft:#FBE8E8;
  --p-sky:#4B2A7B;--p-done:#2E8B57;--p-ec:#1F5FAF;--p-gc:#C0392B;--p-dh:#E2AE12;--p-oth:#5B6573;
  --t-sky:#EFEAF7;--t-done:#E4F2EA;--t-ec:#E6EEF8;--t-gc:#FBEAE8;--t-dh:#FFF5D6;--t-oth:#EEF0F3;
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1216;--surface:#171B21;--surface-2:#1D222A;--surface-3:#232933;
  --ink:#E8EBF0;--ink-2:#C2C9D3;--muted:#8E97A4;--line:#2A3038;--line-strong:#3A424D;
  --accent:#B79BE6;--accent-soft:#272036;--on-accent:#120D1C;
  --ok:#6BC79A;--ok-soft:#18291F;--warn:#E3B45A;--warn-soft:#2C2412;--bad:#F08A8A;--bad-soft:#2E1818;
  --t-sky:#251E33;--t-done:#17281E;--t-ec:#16212F;--t-gc:#2D1A18;--t-dh:#2B2510;--t-oth:#1F242B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0F1216;--surface:#171B21;--surface-2:#1D222A;--surface-3:#232933;
  --ink:#E8EBF0;--ink-2:#C2C9D3;--muted:#8E97A4;--line:#2A3038;--line-strong:#3A424D;
  --accent:#B79BE6;--accent-soft:#272036;--on-accent:#120D1C;
  --ok:#6BC79A;--ok-soft:#18291F;--warn:#E3B45A;--warn-soft:#2C2412;--bad:#F08A8A;--bad-soft:#2E1818;
  --t-sky:#251E33;--t-done:#17281E;--t-ec:#16212F;--t-gc:#2D1A18;--t-dh:#2B2510;--t-oth:#1F242B;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.muted{color:var(--muted)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top .row1{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .ttl{font-family:Archivo;font-weight:700;font-size:16px;white-space:nowrap}
.brand .ttl small{display:block;font:500 11px "IBM Plex Sans";color:var(--muted);letter-spacing:.02em}
.spacer{flex:1}
.peers{display:flex;gap:4px;align-items:center}
.peer{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 11px "IBM Plex Sans";color:#fff;border:2px solid var(--surface)}
.jobbar{display:flex;gap:8px;align-items:center;padding:0 14px 8px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.jobsel{flex:1 1 260px;min-width:0;position:relative}
.jobsel input{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);font-weight:600}
.jobsel .dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:min(60vh,420px);overflow:auto;z-index:40}
.jobsel .dd button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-bottom:1px solid var(--line)}
.jobsel .dd button:hover,.jobsel .dd button.on{background:var(--accent-soft)}
.jobsel .dd small{color:var(--muted)}
.scopechips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.lv{border-color:#7a5ac4;color:#5b3fa3;background:#f1ecfb}
.chip.bda{border-color:#c0392b;color:#8f2a20;background:#fbebe9}
.chip.ke{border-color:#2e8b57;color:#1f6b41;background:#e5f3ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.lv{background:#251e33;color:#c9b6f0}:root:not([data-theme="light"]) .chip.bda{background:#2d1a18;color:#f2a69d}:root:not([data-theme="light"]) .chip.ke{background:#17281e;color:#8fd9ae}}
:root[data-theme="dark"] .chip.lv{background:#251e33;color:#c9b6f0}:root[data-theme="dark"] .chip.bda{background:#2d1a18;color:#f2a69d}:root[data-theme="dark"] .chip.ke{background:#17281e;color:#8fd9ae}
nav.tabs{display:flex;gap:2px;padding:0 10px;max-width:1180px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .n{font:600 11px "IBM Plex Mono";background:var(--surface-3);border-radius:999px;padding:1px 7px;color:var(--ink-2)}

main{max-width:1180px;margin:0 auto;padding:14px 14px 90px}
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(560px,calc(100vw - 24px));padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.banner.ro{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.banner.off{background:var(--surface);border:1px solid var(--line-strong)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:70;background:#1d222a;color:#fff;padding:9px 14px;border-radius:9px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{opacity:1}
.toast.err{background:#8f2020}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:14px;margin-bottom:12px}
.panel h2{font-size:16px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:14px;min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
:disabled{opacity:.75;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.stamp{font-size:11.5px;color:var(--muted)}

/* yes/no pills */
.yn{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:0 0 auto}
.yn button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);min-width:44px}
.yn button+button{border-left:1px solid var(--line-strong)}
.yn button[aria-pressed="true"].y{background:var(--ok-soft);color:var(--ok)}
.yn button[aria-pressed="true"].n{background:var(--surface-3);color:var(--ink)}

/* walk guide */
.walkhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
.prog{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.areas{display:flex;flex-direction:column;gap:10px}
.area{overflow:hidden}
.area .ah{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.area .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex:0 0 auto}
.area .at{flex:1;min-width:0}
.area .at b{font-family:Archivo;font-size:15.5px;display:block}
.area .at small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area .cnt{font:600 12px "IBM Plex Mono";color:var(--ink-2);text-align:right;white-space:nowrap}
.area .tog{font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.area.out .ic{filter:grayscale(1);opacity:.6}
.area .body{border-top:1px solid var(--line);padding:6px 0 4px}
.area .intro{padding:8px 14px 10px;font-size:13.5px;color:var(--ink-2)}
.cp{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.cp:first-of-type{border-top:0}
.cp .q{flex:1;min-width:0;font-size:14.5px}
.cp .q .why{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.cp .q .pty{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.cp .q .lnk{font:600 12px "IBM Plex Mono";color:var(--accent);margin-left:6px;background:none;border:0;padding:0;text-decoration:underline}
.cp .ib{border:0;background:none;color:var(--muted);font-size:15px;padding:2px 4px}
.tri{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex:0 0 auto}
.tri button{border:0;background:var(--surface);padding:7px 10px;font-weight:600;font-size:12.5px;color:var(--muted);min-width:44px}
.tri button+button{border-left:1px solid var(--line-strong)}
.tri button[aria-pressed="true"].ok{background:var(--ok-soft);color:var(--ok)}
.tri button[aria-pressed="true"].is{background:var(--warn-soft);color:var(--warn)}
.tri button[aria-pressed="true"].na{background:var(--surface-3);color:var(--ink)}
.cheat{margin:4px 14px 12px;border:1px dashed var(--line-strong);border-radius:8px;overflow:hidden}
.cheat summary{padding:9px 12px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--surface-2)}
.cheat .tw{overflow-x:auto}
.cheat table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
.cheat td,.cheat th{padding:7px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cheat th{background:var(--surface-2);font-size:12px;color:var(--muted)}

/* legend / party */
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.lg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow)}
.lg[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.lg .sw{width:12px;align-self:stretch;border-radius:4px;flex:0 0 auto}
.lg .tx{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.25}
.lg .num{font:700 20px Archivo}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input[type=search]{flex:1 1 200px;width:auto}
.filters select{width:auto;flex:0 1 auto}
.grp{margin:16px 0 6px;display:flex;align-items:center;gap:8px;font-family:Archivo;font-weight:700;font-size:14px}
.grp .bar{width:6px;height:18px;border-radius:3px}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--line-strong);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
.it:hover{background:var(--surface-2)}
.it .ref{font:600 13px "IBM Plex Mono";color:var(--accent);flex:0 0 auto;min-width:46px}
.it .mid{flex:1;min-width:0}
.it .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ps{display:flex;gap:3px;flex:0 0 auto}
.it .ps .sq{width:12px;height:12px}
.it .ps .sq.dn{opacity:.3}
.it .ph{font-size:12px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.it .st{font:600 11.5px "IBM Plex Sans";padding:2px 8px;border-radius:999px;flex:0 0 auto}
.st.open{background:var(--warn-soft);color:var(--warn)}
.st.closed{background:var(--ok-soft);color:var(--ok)}
.it .eye{font-size:11px;color:var(--accent);flex:0 0 auto}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* editor sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(10,12,16,.35)}
.sheet .pane{width:min(720px,100%);height:100%;background:var(--ground);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.sheet .ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px}
.sheet .ph .ref{font:700 18px "IBM Plex Mono";color:var(--accent)}
.sheet .ph .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sb{flex:1;overflow:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.pb{border:1px solid var(--line);border-left:6px solid var(--line-strong);border-radius:10px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.pb .pbh{display:flex;align-items:center;gap:10px;padding:9px 12px}
.pb .pbh b{flex:1;min-width:0;font-size:14px}
.pb .pbb{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.pb .pbb .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-size:11.5px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--surface-3);border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
.photo .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.addph{aspect-ratio:3/4;border:2px dashed var(--line-strong);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);font-weight:600;font-size:13px;background:var(--surface)}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.secthead{font:700 12px "IBM Plex Sans";letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

/* report preview */
.rpv{display:grid;gap:12px}
.rpv .cover{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.rpv .band{background:#4B2A7B;color:#fff;padding:16px 18px}
.rpv .band small{opacity:.85;font-size:11px;letter-spacing:.08em}
.rpv .band h3{font-size:22px;margin:2px 0 4px;color:#fff}
.rpv .strip{display:flex;height:6px}.rpv .strip i{flex:1}
.rpv table{width:100%;border-collapse:collapse;font-size:13.5px}
.rpv td{padding:7px 12px;border-top:1px solid var(--line)}
.rpv td:first-child{width:38%;font-weight:600;color:var(--muted);background:var(--surface-2)}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(10,12,16,.6);display:grid;place-items:center;color:#fff;font-weight:600;text-align:center;padding:20px}
.overlay .bx{background:#1d222a;padding:20px 26px;border-radius:12px;min-width:240px}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.act:first-child{border-top:0}
.act .when{flex:0 0 92px;color:var(--muted);font-size:12px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-strong);text-decoration:none;color:var(--ink);background:var(--surface-2)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.alarmline{color:var(--bad);font-weight:600}

@media (max-width:640px){
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
  .brand .ttl small{display:none}
  .brand img{height:26px}
  main{padding:10px 10px 90px}
  .cp{flex-wrap:wrap}
  .cp .q{flex:1 1 100%}
  .cp .tri{margin-left:auto}
  .it .ph{display:none}
  .area .ah{flex-wrap:wrap}
  .area .cnt{order:5;flex-basis:100%;text-align:left;padding-left:48px;white-space:normal}
  .lg .num{font-size:18px}
}

/* ===== phone & iPad first ===== */
button,.btn,.tri button,.yn button,nav.tabs button,.it,.lg{min-height:44px}
.tri button{min-width:56px;font-size:13.5px}
.cp{min-height:56px}
@media (max-width:1023px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom,0px);justify-content:space-around;max-width:none;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
  nav.tabs button{flex:1 1 0;flex-direction:column;gap:1px;padding:7px 2px 6px;font-size:11px;border-bottom:0;border-top:3px solid transparent;min-width:0}
  nav.tabs button[aria-selected="true"]{border-top-color:var(--accent)}
  nav.tabs button .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs button .ico{font-size:19px;line-height:1}
  nav.tabs .n{position:absolute;margin:-4px 0 0 22px;font-size:10px;padding:0 5px}
  nav.tabs button{position:relative}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .banner{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
  .fab{display:flex}
}
@media (min-width:1024px){nav.tabs .ico{margin-right:2px}.fab{display:none}}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.28);align-items:center;justify-content:center}
/* iPad: editor as side panel; phone: full screen */
@media (max-width:767px){.sheet{background:var(--ground)}.sheet .pane{width:100%;box-shadow:none}}
@media (min-width:768px) and (max-width:1023px){.sheet .pane{width:min(620px,78vw)}}
.sheet .pane{animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.camrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.camrow .btn{justify-content:center;min-height:52px;font-size:15px}

.ahrow{display:flex;align-items:stretch}
.ahrow .ah{flex:1;min-width:0}
.cambtn{flex:0 0 auto;border:0;border-left:1px solid var(--line);background:var(--accent-soft);font-size:22px;min-width:56px;padding:0 10px}
.cambtn.sm{border:1px solid var(--line-strong);border-radius:8px;font-size:18px;min-width:44px;min-height:44px;background:var(--surface)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.photo .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;line-height:1.25;padding:4px 6px;max-height:3.9em;overflow:hidden}
.addph{font-size:22px}
.addph span{font-size:12px}
.tick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 12px;margin-bottom:6px;font-size:14px}
.tick .box{font-size:20px;line-height:1}
.tick.on{background:var(--accent-soft);border-color:var(--accent)}
.it .cic{flex:0 0 auto;font-size:16px}
.cp .tri{flex:0 0 auto}
@media (max-width:640px){.cp .cambtn.sm{margin-left:0}.ahrow .cambtn{min-width:52px}}
#langSw button{min-width:42px;min-height:36px;font-size:12.5px;padding:4px 8px}
#langSw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.smpl{border:1px solid var(--line-strong);background:var(--accent-soft);color:var(--accent);border-radius:999px;font:600 12px 'IBM Plex Sans';padding:2px 9px;margin-left:6px;min-height:30px}
.nabtn{flex:0 0 auto;border:0;border-left:1px solid var(--line);background:var(--surface-2);font:700 13px 'IBM Plex Sans';color:var(--muted);min-width:52px;padding:0 8px}
.nabtn.on{background:var(--surface-3);color:var(--ink)}
.smptag{display:inline-block;background:#E2AE12;color:#2b2200;font:700 12px 'IBM Plex Sans';letter-spacing:.06em;padding:4px 10px;border-radius:6px;margin-bottom:8px}
.msample{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.carry{display:inline-block;font:600 12px 'IBM Plex Sans';color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.rcard{padding:10px 12px;margin-bottom:10px}
.rch{display:flex;align-items:center;gap:10px;margin-bottom:6px}.rch b{flex:1;min-width:0}
.rch .ref{font:700 14px 'IBM Plex Mono';color:var(--accent)}
.rcp{border-radius:8px;padding:8px 10px;margin-top:6px}.rcp ul{margin:4px 0 0;padding-left:20px}.rcp li{margin:2px 0;font-size:14px}
.rcpt{display:flex;align-items:center;gap:6px;font-size:13px}
</style>
</head>
<body>
<div id="collabConfig" data-multi="1" hidden></div>
<header class="top">
  <div class="row1">
    <div class="brand"><img id="logoImg" alt="Skylight Techs"><div class="ttl"><span data-i18n="Field Walk">Field Walk</span><small data-i18n="Progressive walkthrough · open items by responsible party">Progressive walkthrough · open items by responsible party</small></div></div>
    <div class="spacer"></div>
    <div class="peers" id="peers" aria-label="Who else is here"></div><div class="yn" id="langSw" role="group" aria-label="Language / Idioma"><button type="button" class="y" data-lang="en">EN</button><button type="button" class="y" data-lang="es">ES</button></div>
  </div>
  <div class="jobbar">
    <div class="jobsel">
      <input id="jobInput" type="text" placeholder="Pick a job (from the Workflow)…" data-i18n-ph="Pick a job (from the Workflow)…" autocomplete="off" aria-label="Job">
      <div class="dd hide" id="jobDD" role="listbox"></div>
    </div>
    <div class="scopechips" id="scopeChips"></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="walk" aria-selected="true"><span class="ico">🚶</span><span class="lbl" data-i18n="Walk">Walk</span></button>
    <button role="tab" data-tab="doors" aria-selected="false"><span class="ico">🚪</span><span class="lbl" data-i18n="Doors">Doors</span></button>
    <button role="tab" data-tab="items" aria-selected="false"><span class="ico">📋</span><span class="lbl" data-i18n="Items">Items</span><span class="n" id="nOpen">0</span></button>
    <button role="tab" data-tab="walks" aria-selected="false"><span class="ico">🗂</span><span class="lbl" data-i18n="Record">Record</span><span class="n" id="nWalks">0</span></button>
    <button role="tab" data-tab="report" aria-selected="false"><span class="ico">📄</span><span class="lbl" data-i18n="Report">Report</span></button>
    <button role="tab" data-tab="job" aria-selected="false"><span class="ico">⚙</span><span class="lbl" data-i18n="Job">Job</span></button>
    <button role="tab" data-tab="activity" aria-selected="false"><span class="ico">🕑</span><span class="lbl" data-i18n="Log">Log</span></button>
    <button role="tab" data-tab="master" aria-selected="false" class="hide"><span class="ico">🧩</span><span class="lbl" data-i18n="Master">Master</span></button>
  </nav>
</header>

<main id="main">
  <div class="empty" id="noJob" data-i18n="Pick a job above to start. Every job on the Workflow is listed.">Pick a job above to start. Every job on the Workflow is listed.</div>

  <section id="v-walk" class="view hide">
    <div class="card panel" id="walkPanel"></div>
    <div class="areas" id="areas"></div>
  </section>

  <section id="v-items" class="view hide">
    <div class="legend" id="legend"></div>
    <div class="filters">
      <input type="search" id="fSearch" placeholder="Search location, door tag, camera #, note…" data-i18n-ph="Search location, door tag, camera #, note…" aria-label="Search">
      <select id="fLevel" aria-label="Level"></select>
      <select id="fGroup" aria-label="Group by"><option value="party" data-i18n="Group by party">Group by party</option><option value="level" data-i18n="Group by level">Group by level</option><option value="cards" selected data-i18n="📄 Report view (notes + photos)">📄 Report view (notes + photos)</option><option value="ref" data-i18n="By number">By number</option></select>
      <select id="fState" aria-label="Status"><option value="open" data-i18n="Open only">Open only</option><option value="all" data-i18n="Open + resolved">Open + resolved</option><option value="closed" data-i18n="Resolved only">Resolved only</option></select>
      <button class="btn pri" id="btnNewItem" type="button" data-i18n="＋ New item">＋ New item</button>
    </div>
    <div id="itemList"></div>
  </section>

  <section id="v-doors" class="view hide"><div class="card panel" id="doorPanel"></div></section>

  <section id="v-walks" class="view hide">
    <div id="walkList"></div>
  </section>

  <section id="v-report" class="view hide">
    <div class="card panel" id="reportPanel"></div>
  </section>

  <section id="v-job" class="view hide">
    <div class="card panel" id="jobPanel"></div>
  </section>

  <section id="v-master" class="view hide"><div class="card panel" id="masterPanel"></div></section>

  <section id="v-activity" class="view hide">
    <div class="card panel"><h2 data-i18n="🕑 Recent edits on this job">🕑 Recent edits on this job</h2><div id="actList" style="margin-top:8px"></div></div>
  </section>
</main>

<button class="fab hide" id="fab" type="button" aria-label="New item">＋</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="bannerHost"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hide">
<input type="file" id="photoInputLib" accept="image/*" multiple class="hide">

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-').map(Number);if(!y)return s;return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})};
const fmtShort=s=>{if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-');return `${m}/${d}/${String(y).slice(2)}`};
const ago=iso=>{if(!iso)return'';const es=typeof LANG!=='undefined'&&LANG==='es';const s=(Date.now()-new Date(iso))/1000;if(s<60)return es?'ahora':'just now';if(s<3600)return es?'hace '+Math.round(s/60)+' min':Math.round(s/60)+' min ago';if(s<86400)return es?'hace '+Math.round(s/3600)+' h':Math.round(s/3600)+' h ago';return new Date(iso).toLocaleDateString(es?'es-US':'en-US',{month:'short',day:'numeric'})};

  const subs=new Set();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
  window.addEventListener('storage',e=>{if(e.key===KEY){try{const nd=JSON.parse(e.newValue||'{}');Object.keys(data).forEach(k=>delete data[k]);Object.assign(data,nd);fire()}catch(x){}}});
  const fire=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const snap=p=>({id:p.split('/').pop(),exists:p in data,data:()=>data[p]?JSON.parse(JSON.stringify(data[p])):undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function q(col,fl=[],ord=null,lim=0){const run=()=>{let docs=Object.keys(data).filter(p=>p.slice(0,p.lastIndexOf('/'))===col).map(snap);
      fl.forEach(([f,o,v])=>{docs=docs.filter(d=>{const x=d.data()[f];return o==='=='?x===v:true})});
      if(ord)docs.sort((a,b)=>{const x=a.data()[ord[0]]??'',y=b.data()[ord[0]]??'';return (x<y?-1:x>y?1:0)*(ord[1]==='desc'?-1:1)});else docs.sort((a,b)=>a.id<b.id?-1:1);
      if(lim)docs=docs.slice(0,lim);return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}}};
    return {where:(f,o,v)=>q(col,[...fl,[f,o,v]],ord,lim),orderBy:(f,d)=>q(col,fl,[f,d||'asc'],lim),limit:n=>q(col,fl,ord,n),get:async()=>run(),
      onSnapshot:n=>{const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},doc:id=>doc(col+'/'+id)}}
  function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
  function doc(p){return {id:p.split('/').pop(),path:p,get:async()=>snap(p),set:async d=>{data[p]=JSON.parse(JSON.stringify(d));save();fire()},
    update:async d=>{if(!(p in data))throw{code:'invalid_argument'};merge(data[p],JSON.parse(JSON.stringify(d)));save();fire()},delete:async()=>{delete data[p];save();fire()},
    acquire:async()=>({acquired:true}),onSnapshot:n=>{const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},collection:c=>q(p+'/'+c)}}
  return {doc,collection:c=>q(c)};
}

async function renderMeter(){const host=$('#storeMeter');if(!host)return;watchStorage();
  const dbc=Object.values(STORE).reduce((a,v)=>({n:a.n+(v.count||0),b:a.b+(v.bytes||0)}),{n:0,b:0});let u=null;try{if(S.assets)u=(await S.assets.list()).usage}catch(e){}

function renderJobClose(){const host=$('#jobClose');if(!host)return;const j=S.jobs[S.pid]||{};const can=S.isOwner||S.canWrite;

  host.innerHTML=`<div class="secthead">🔒 ${X('Close job')}</div>${j.closed?`<p>🔒 ${X('Closed')} ${esc(ago(j.closedAt))} · ${esc(whoName(j.closedBy))}. ${X('Photos open from Drive.')}</p>${can?`<button class="btn" type="button" id="jobReopen">${X('Reopen job')}</button>`:''}`

async function closeJob(){const j=S.jobs[S.pid];if(!j||!S.isOwner)return;if(!confirm(X('Close this job and remove its small photo copies? Full photos stay in Drive.')))return;
  let n=0,b=0;for(const [did,d] of Object.entries(S.phDocs)){let ch=false;const list=(d.list||[]).map(p=>{if(p.th&&p.src&&p.src.startsWith('g:')&&p.th!==p.src){const th=p.th;
      if(th.startsWith('d:')){chain('blobs/'+th.slice(2),()=>S.db.doc('blobs/'+th.slice(2)).delete());n++;b+=60000}else if(th.startsWith('a:')&&S.assets){S.assets.delete(th.slice(2)).catch(()=>{})}ch=true;const q={...p};delete q.th;return q}return p});
    if(ch){d.list=list;const path=`jobs/${S.pid}/photos/${did}`;chain(path,()=>S.db.doc(path).update({list}))}}

        const r=await mcpCall('Google Drive','create_file',{title:fn,parentId:folder,base64Content:await b64(blob),contentMimeType:'application/pdf',disableConversionToGoogleType:true});driveUrl=r.viewUrl||'';
        const st=stampOf();const rec={id:r.id,url:driveUrl,title:fn,at:st.at,by:st.by};if(w)w.pdf=rec;writeField(`jobs/${S.pid}/walks/${wid}`,'pdf',rec,'📄 PDF saved to Drive: '+fn)}catch(e){console.warn('pdf drive',e);toast('PDF not saved to Drive — downloaded only',1)}}
    if(opts.email){ov.remove();return {blob,fn,url:driveUrl,date,items}}
    ov.remove();
    if(S.dl){try{await S.dl.save({filename:fn,data:blob});toast('PDF ready')}catch(e){if(e&&e.code!=='declined'&&e.code!=='cancelled')toast('Download not completed',1)}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();window.__lastPdf=blob}
    if(!driveUrl)logEdit('','pdf',`PDF generated${walkId?' for the walk of '+fmtShort(date):''}`);if(S.view==='report')renderReport();if(S.view==='walks')renderWalks();
  }catch(e){console.error(e);ov.remove();toast('PDF failed: '+(e.message||e),1)}
}
const NET_EN='Active internet service must be provided in the MDF room for the Skylight Techs low voltage systems (cameras, access control and network) to be brought online and fully operational. Please coordinate activation with the owner / ISP ahead of system commissioning.';const NET_ES='Se debe proveer servicio de internet activo en el cuarto MDF para poner en línea y en pleno funcionamiento los sistemas de bajo voltaje de Skylight Techs (cámaras, control de acceso y red). Por favor coordine la activación con el dueño / ISP antes de la puesta en marcha.';
function fmtDateEs(s){if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function netBox(doc,y,tr){const W=612,M=50;const tx=doc.setFontSize(9).splitTextToSize(pdfText(tr(NET_EN,NET_ES)),W-2*M-60);
  const h=30+tx.length*11;doc.setFillColor(252,234,234);doc.setDrawColor(192,57,43);doc.rect(M+10,y,W-2*M-20,h,'FD');doc.setFillColor(192,57,43);doc.rect(M+10,y,4,h,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(150,30,30);doc.text(tr('IMPORTANT – INTERNET SERVICE REQUIRED IN MDF ROOM','IMPORTANTE – SE REQUIERE INTERNET EN EL CUARTO MDF'),M+26,y+17);doc.setFont('helvetica','normal');doc.setTextColor(30,34,40);doc.text(tx,M+26,y+31);return y+h+12}
function frame(doc,p,j,date,page,ES){const W=612,H=792;doc.setFillColor(75,42,123);doc.rect(0,0,W,50,'F');doc.setFillColor(...p.rgb);doc.rect(0,50,14,H-50,'F');doc.rect(W-14,50,14,H-50,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('SKYLIGHT',40,26);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('TECHS',40+doc.setFontSize(14).getTextWidth('SKYLIGHT')+4,26);
  doc.setFontSize(5.5);doc.text('LOW VOLTAGE CONTRACTORS',40,36);doc.setFontSize(9.5);doc.text(pdfText((j.name||'')+(ES?'  |  Recorrido progresivo de bajo voltaje':'  |  Low Voltage Progressive Walkthrough')),W-50,30,{align:'right'});footer(doc,page,p,date,ES);return 74}
function footer(doc,page,p,date,ES){const W=612,H=792,M=50;doc.setDrawColor(215,218,224);doc.line(M+10,H-46,W-M,H-46);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110,116,128);
  if(!p){doc.text(ES?'Preparado por Skylight Techs  |  skytechslv.com':'Prepared by Skylight Techs  |  skytechslv.com',M+10,H-32);return}
  doc.text(ES?'Recorrido: '+fmtDateEs(date).replace(/^[^,]+, /,''):'Walkthrough: '+fmtDate(date).replace(/^\w+, /,''),M+10,H-32);doc.text((ES?'Página ':'Page ')+page,W-M,H-32,{align:'right'});
  const lbl=pdfText(ES?PLES[p.k](S.jobs[S.pid]||{}):p.label(S.jobs[S.pid]||{}));doc.setFont('helvetica','bold');const tw=doc.getTextWidth(lbl)+20;doc.setFillColor(...p.rgb);doc.roundedRect(W/2-tw/2,H-43,tw,16,3,3,'F');doc.setTextColor(...(p.dark?[50,40,0]:[255,255,255]));doc.text(lbl,W/2,H-32,{align:'center'})}

boot();
